[package]
name = "auxin"
version = "0.1.0"
description = "Auxin — local microservice manager"
authors = ["Auxin"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "auxin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
libc = "0.2.191"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "cookies"] }
notify = "8"
base64 = "0.23"
tokio = { version = "1", features = ["sync", "time", "net"] }
serde_yaml_ng = "0.10"
lapin = { version = "=4.12.1", default-features = false, features = ["tokio", "rustls--ring", "rustls-platform-verifier"] }
# No zstd: rskafka 0.6 needs zstd 0.13, which has known vulnerabilities (RUSTSEC-2026-0391,
# -0398, -0403; fixed in zstd 0.14.3). Turn it back on once rskafka moves to a fixed zstd.
rskafka = { version = "=0.6.0", default-features = false, features = ["compression-gzip", "compression-lz4", "compression-snappy"] }
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
http-body-util = "0.1.5"
flate2 = "1.1.10"
prost = "0.14.4"
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic-messages", "trace", "with-serde"] }


[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
