[package]
name = "auxin"
version = "0.1.0"
description = "Auxin — local microservice manager"
authors = ["Auxin"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "auxin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
libc = "0.2.191"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "cookies"] }
notify = "8"
base64 = "0.22"
tokio = { version = "1", features = ["sync", "time"] }
serde_yaml_ng = "0.10"
lapin = { version = "=4.12.1", default-features = false, features = ["tokio", "rustls--ring", "rustls-platform-verifier"] }
rskafka = "=0.6.0"


[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3.27.0"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
